<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Settings - Ezviz Viewer</title>
</head>
<body>
    {% if session.user %}
        <h1>Settings</h1>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <ul>
                {% for category, message in messages %}
                    <li class="{{ category }}">{{ message }}</li>
                {% endfor %}
                </ul>
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('settings_page') }}">
            <div>
                <label for="app_key">Ezviz App Key:</label>
                <input type="password" id="app_key" name="app_key" value="{{ current_app_key if current_app_key else '' }}">
            </div>
            <div>
                <button type="submit">Save App Key</button>
            </div>
        </form>
        
        <p><a href="{{ url_for('index') }}">Back to Home</a></p>
    {% else %}
        <p>Please <a href="{{ url_for('login') }}">login</a> to access settings.</p>
    {% endif %}
</body>
</html>
